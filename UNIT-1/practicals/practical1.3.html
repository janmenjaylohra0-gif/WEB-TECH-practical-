<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HTML Table Examples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f4f8;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
            color: #2c3e50;
            background-color: #e8f4f8;
        }
        th {
            background-color: #3498db;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
        }
        td {
            padding: 10px;
            border: 1px solid #ddd;
        }
        th, td {
            border: 1px solid #bdc3c7;
        }
        .center {
            text-align: center;
        }
        .right {
            text-align: right;
        }
        .left {
            text-align: left;
        }
        .highlight {
            background-color: #fff3cd;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
        <caption>Weekly Class Schedule</caption>
        <thead>
            <tr class="center">
                <th>Time</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
            </tr>
        </thead>
        <tbody>
            <tr class="center">
                <td><strong>9:00 AM</strong></td>
                <td>maths</td>
                <td>web-Tech</td>
                <td>maths</td>
                <td>Web-tech</td>
                <td>Math</td>
            </tr>
            <tr class="center">
                <td><strong>10:00 AM</strong></td>
                <td>pfc</td>
                <td>nals</td>
                <td>maths</td>
                <td>lab</td>
                <td>english</td>
            </tr>
            <tr class="center">
                <td><strong>11:00 AM</strong></td>
                <td>nals</td>
                <td>pfc</td>
                <td>english</td>
                <td>dl</td>
                <td>dl</td>
            </tr>
            <tr class="center">
                <td><strong>12:00 PM</strong></td>
                <td>Web-tech</td>
                <td>maths</td>
                <td>activity</td>
                <td>english</td>
                <td>dl</td>
            </tr>
            <tr class="center">
                <td><strong>1:00 PM Lunch</strong></td>
                <td><strong>Lunch</strong></td>
                <td><strong>Lunch</strong></td>
                <td><strong>Lunch</strong></td>
                <td><strong>Lunch</strong></td>
                <td><strong>Lunch</strong></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
